<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інтерактивний розклад учителя</title>
  <meta name="theme-color" content="#2f6fb1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Розклад" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <style>
    :root {
      --bg-top: #f7f3e8;
      --bg-bottom: #e8eef7;
      --paper: rgba(255, 252, 245, 0.94);
      --paper-strong: #fffdf7;
      --ink: #2a2d34;
      --muted: #6e6a63;
      --line: #c9bfab;
      --accent: #2f6fb1;
      --accent-soft: #e8f0fb;
      --accent-strong: #215587;
      --success: #2d8b57;
      --danger: #a94d43;
      --shadow: 0 22px 50px rgba(49, 56, 71, 0.18);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 34%),
        linear-gradient(180deg, var(--bg-top) 0%, #f6f0df 30%, var(--bg-bottom) 100%);
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 14px 44px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .title-card,
    .toolbar {
      background: rgba(255, 250, 242, 0.8);
      border: 1px solid rgba(201, 191, 171, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .title-card {
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .title-card::after {
      content: "";
      position: absolute;
      inset: auto -40px -60px auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(47, 111, 177, 0.16), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(47, 111, 177, 0.12);
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      max-width: 56ch;
    }

    .toolbar {
      padding: 18px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .toolbar p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar-actions .btn {
      flex: 1 1 180px;
    }

    button {
      font: inherit;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 25px rgba(47, 111, 177, 0.24);
    }

    .btn-secondary {
      background: #f4ecdc;
      color: var(--ink);
      border: 1px solid rgba(201, 191, 171, 0.9);
    }

    .btn-danger {
      background: #f8e6e2;
      color: var(--danger);
      border: 1px solid rgba(169, 77, 67, 0.18);
    }

    .status {
      padding: 12px 14px;
      border-radius: 14px;
      background: #f6efe1;
      border: 1px dashed rgba(201, 191, 171, 0.9);
      color: var(--muted);
      font-size: 13px;
    }

    .timer {
      padding: 8px 12px;
      border-radius: 12px;
      background: #f9f4e7;
      border: 1px dashed rgba(201, 191, 171, 0.7);
      color: var(--muted);
      font-size: 12px;
    }

    .board {
      background: var(--paper);
      border: 1px solid rgba(201, 191, 171, 0.95);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .board-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
      background: var(--paper-strong);
    }

    thead th {
      background: linear-gradient(180deg, #f0eadb 0%, #ece4d1 100%);
      border: 2px solid #4f4a43;
      padding: 14px 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      text-align: center;
    }

    .mobile-day {
      display: none;
    }

    tbody th,
    tbody td {
      border: 2px solid #4f4a43;
      vertical-align: top;
      background: rgba(255, 252, 245, 0.92);
    }

    .num-col {
      width: 68px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      padding: 10px 6px;
    }

    .time-col {
      width: 148px;
      text-align: center;
      padding: 10px 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.2;
    }

    .lesson-cell {
      padding: 8px;
      min-height: 98px;
    }

    .lesson-card,
    .empty-card {
      width: 100%;
      min-height: 94px;
      border-radius: 18px;
      padding: 12px;
    }

    .lesson-card {
      border: 1px solid rgba(47, 111, 177, 0.15);
      background: linear-gradient(180deg, #ffffff 0%, #f6f9ff 100%);
      box-shadow: 0 10px 22px rgba(31, 49, 78, 0.10);
      display: grid;
      gap: 8px;
      align-content: space-between;
    }

    .lesson-main {
      cursor: pointer;
      border: none;
      padding: 0;
      background: transparent;
      text-align: left;
    }

    .lesson-main:hover .subject {
      color: var(--accent-strong);
    }

    .subject {
      display: block;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .class-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: 100%;
      padding: 6px 10px;
      border-radius: 12px;
      background: linear-gradient(180deg, #2f6fb1 0%, #215587 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1;
      box-shadow: 0 10px 18px rgba(47, 111, 177, 0.24);
    }

    .meta,
    .students-preview {
      display: block;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }

    .students-preview {
      color: var(--success);
      font-weight: 700;
    }

    .lesson-format {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e8f0fb;
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tiny-btn {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .tiny-view {
      background: #edf4ff;
      color: var(--accent-strong);
    }

    .tiny-edit {
      background: #f4ecdc;
      color: #69563c;
    }

    .empty-card {
      display: grid;
      place-items: center;
      color: #8a8378;
      border: 1px dashed rgba(79, 74, 67, 0.35);
      background: rgba(244, 239, 225, 0.58);
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .empty-card:hover {
      background: rgba(236, 228, 209, 0.85);
      transform: translateY(-1px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 33, 43, 0.56);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(100%, 560px);
      max-height: min(88vh, 900px);
      overflow: auto;
      background: #fffdf8;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 28px 60px rgba(17, 22, 31, 0.28);
      transform: translateY(12px) scale(0.98);
      transition: transform 0.2s ease;
      border: 1px solid rgba(201, 191, 171, 0.95);
    }

    .modal-overlay.open .modal {
      transform: translateY(0) scale(1);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0;
      font-size: 24px;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.15;
    }

    .modal-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #efe6d4;
      color: var(--ink);
      font-size: 24px;
      cursor: pointer;
    }

    .students-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .students-list li {
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--accent-soft);
      border: 1px solid rgba(47, 111, 177, 0.08);
    }

    .student-row {
      display: grid;
      gap: 10px;
    }

    .student-name {
      font-weight: 800;
      font-size: 15px;
      color: var(--ink);
    }

    .student-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .student-check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .student-check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .student-group {
      min-width: 180px;
      border: 1px solid rgba(201, 191, 171, 0.95);
      border-radius: 12px;
      padding: 9px 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .time-list {
      display: grid;
      gap: 10px;
    }

    .time-row {
      display: grid;
      grid-template-columns: 88px 1fr 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f8f3e6;
      border: 1px solid rgba(201, 191, 171, 0.7);
    }

    .time-row strong {
      font-size: 14px;
      color: var(--ink);
    }

    .time-row input {
      width: 100%;
      border: 1px solid rgba(201, 191, 171, 0.95);
      border-radius: 12px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid rgba(201, 191, 171, 0.95);
      border-radius: 14px;
      padding: 12px 13px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }

    .field textarea {
      min-height: 112px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }

    .right-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hidden {
      display: none;
    }

    @page {
      size: A4 landscape;
      margin: 5mm;
    }

    @media print {
      body {
        background: #fff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .modal-overlay,
      .toolbar,
      .card-actions,
      .empty-card {
        display: none !important;
      }

      .hero {
        display: block;
        margin-bottom: 3mm;
      }

      .title-card {
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #c9bfab;
        border-radius: 12px;
        box-shadow: none;
        backdrop-filter: none;
        break-inside: avoid;
      }

      h1 {
        font-size: 20px;
        line-height: 1.05;
      }

      .board {
        box-shadow: none;
        border: 1px solid #c9bfab;
        border-radius: 12px;
        overflow: visible;
        background: #fff;
        break-inside: avoid;
      }

      .board-scroll {
        overflow: visible;
      }

      table {
        min-width: 0;
        width: 100%;
        table-layout: fixed;
        background: var(--paper-strong);
      }

      thead th,
      tbody th,
      tbody td {
        border: 1px solid #4f4a43;
        background: #fff;
      }

      thead th {
        padding: 6px 4px;
        font-size: 10px;
        background: #f0eadb;
      }

      .desktop-day {
        display: inline !important;
      }

      .mobile-day {
        display: none !important;
      }

      .num-col {
        width: 28px;
        padding: 4px 2px;
        font-size: 9px;
      }

      .time-col {
        display: table-cell !important;
        width: 76px;
        padding: 4px 3px;
        font-size: 8px;
      }

      .lesson-cell {
        padding: 2px;
      }

      .lesson-card {
        min-height: 0;
        padding: 3px 4px;
        border: 1px solid rgba(47, 111, 177, 0.12);
        border-radius: 8px;
        box-shadow: none;
        background: #fff;
        gap: 2px;
      }

      .lesson-main {
        cursor: default;
        pointer-events: none;
      }

      .subject {
        font-size: 8px;
        margin-bottom: 1px;
      }

      .class-badge {
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 8px;
        box-shadow: none;
      }

      .meta,
      .students-preview {
        font-size: 7px;
        line-height: 1.05;
      }

      .lesson-format {
        padding: 1px 3px;
        font-size: 7px;
        background: #e8f0fb;
        color: var(--accent-strong);
      }

      .lesson-card {
        min-height: 20mm;
      }

      .lesson-card .meta:first-of-type {
        display: none;
      }
    }

    @media (max-width: 920px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 18px 10px 28px;
      }

      .title-card,
      .toolbar,
      .board {
        border-radius: 20px;
      }

      .form-grid.two {
        grid-template-columns: 1fr;
      }

      .time-row {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 18px;
        border-radius: 20px;
      }

      .modal-title {
        font-size: 21px;
      }

      .board-scroll {
        overflow-x: visible;
      }

      table {
        min-width: 100%;
      }

      thead th {
        padding: 8px 3px;
        font-size: 11px;
        line-height: 1.1;
      }

      thead th:nth-child(2),
      .time-col {
        display: none;
      }

      .desktop-day {
        display: none;
      }

      .mobile-day {
        display: inline;
      }

      .num-col {
        width: 34px;
        padding: 8px 2px;
        font-size: 14px;
      }

      .lesson-cell {
        padding: 3px;
      }

      .lesson-card,
      .empty-card {
        min-height: 68px;
        padding: 6px;
        border-radius: 10px;
      }

      .lesson-card {
        gap: 5px;
      }

      .subject {
        font-size: 10px;
        margin-bottom: 3px;
        line-height: 1.15;
      }

      .class-badge {
        padding: 4px 6px;
        border-radius: 8px;
        font-size: 12px;
      }

      .meta,
      .students-preview {
        font-size: 8px;
        line-height: 1.15;
      }

      .lesson-format {
        padding: 3px 5px;
        font-size: 7px;
        gap: 4px;
      }

      .meta:last-of-type {
        display: none;
      }

      .card-actions {
        gap: 4px;
      }

      .tiny-view {
        display: none;
      }

      .tiny-btn {
        width: 100%;
        padding: 5px 4px;
        border-radius: 8px;
        font-size: 9px;
      }

      .empty-card {
        font-size: 9px;
        line-height: 1.15;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="title-card">
        <h1>Розклад занять 2025/2026</h1>
      </div>

      <aside class="toolbar">
        <div class="toolbar-actions">
          <button class="btn btn-secondary" id="printBtn">Друк A4</button>
          <button class="btn btn-secondary" id="editTimesBtn">Часи уроків</button>
          <button class="btn btn-danger" id="resetBtn">Видалити журнал</button>
        </div>
        <div class="status" id="statusText"></div>
        <div class="timer" id="timerText"></div>
      </aside>
    </section>

    <section class="board">
      <div class="board-scroll">
        <table>
          <thead>
            <tr>
              <th>№</th>
              <th>Час</th>
              <th><span class="desktop-day">Понеділок</span><span class="mobile-day">Пн</span></th>
              <th><span class="desktop-day">Вівторок</span><span class="mobile-day">Вт</span></th>
              <th><span class="desktop-day">Середа</span><span class="mobile-day">Ср</span></th>
              <th><span class="desktop-day">Четвер</span><span class="mobile-day">Чт</span></th>
              <th><span class="desktop-day">П’ятниця</span><span class="mobile-day">Пт</span></th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="viewOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="viewTitle">Урок</h2>
          <p class="modal-subtitle" id="viewSubtitle"></p>
        </div>
        <button class="icon-btn" type="button" data-close="view">&times;</button>
      </div>
      <ul class="students-list" id="studentsList"></ul>
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" id="editFromViewBtn">Редагувати</button>
        <div class="right-actions">
          <button class="btn btn-primary" type="button" data-close="view">Закрити</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="modal-head">
        <div>
          <h2 class="modal-title" id="editTitle">Редагування уроку</h2>
          <p class="modal-subtitle">Заповніть поля нижче. Імена учнів вводяться по одному в рядку або через кому.</p>
        </div>
        <button class="icon-btn" type="button" data-close="edit">&times;</button>
      </div>

      <form id="lessonForm">
        <div class="form-grid two">
          <div class="field">
            <label for="lessonDay">День</label>
            <select id="lessonDay" required></select>
          </div>
          <div class="field">
            <label for="lessonHour">Номер уроку</label>
            <select id="lessonHour" required></select>
          </div>
        </div>

        <div class="form-grid two">
          <div class="field">
            <label for="lessonSubject">Предмет</label>
            <input id="lessonSubject" type="text" placeholder="Наприклад, Математика" required />
          </div>
          <div class="field">
            <label for="lessonClass">Клас</label>
            <input id="lessonClass" type="text" placeholder="Наприклад, 7-А" required />
          </div>
        </div>

        <div class="field">
          <label for="lessonStudents">Учні</label>
          <textarea id="lessonStudents" placeholder="Іван Іванов&#10;Анна Петрова&#10;Максим Коваль"></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn btn-danger hidden" type="button" id="deleteLessonBtn">Видалити урок</button>
          <div class="right-actions">
            <button class="btn btn-secondary" type="button" data-close="edit">Скасувати</button>
            <button class="btn btn-primary" type="submit">Зберегти</button>
          </div>
        </div>

    function cloneDefaults() {
      return JSON.parse(JSON.stringify(defaultSchedule));
    }

    function cloneDefaultLessonTimes() {
      return JSON.parse(JSON.stringify(DEFAULT_LESSON_TIMES));
    }

    function normalizeTimeRange(value, fallback) {
      const raw = String(value || "").trim();
      const match = raw.match(/^(\d{2}:\d{2})\s*-\s*(\d{2}:\d{2})$/);
      if (!match) {
        return fallback || null;
      }
      return `${match[1]} - ${match[2]}`;
    }

    function loadLessonTimes() {
      try {
        const raw = localStorage.getItem(TIMES_STORAGE_KEY);
        if (!raw) {
          return cloneDefaultLessonTimes();
        }

        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") {
          return cloneDefaultLessonTimes();
        }

        const normalized = {};
        Object.keys(DEFAULT_LESSON_TIMES).forEach(hour => {
          normalized[hour] = normalizeTimeRange(parsed[hour], DEFAULT_LESSON_TIMES[hour]) || DEFAULT_LESSON_TIMES[hour];
        });
        return normalized;
      } catch (error) {
        console.error(error);
        return cloneDefaultLessonTimes();
      }
    }

    function saveLessonTimes() {
      localStorage.setItem(TIMES_STORAGE_KEY, JSON.stringify(lessonTimes));
    }

    function normalizeStudent(rawStudent) {
      if (typeof rawStudent === "string") {
        const name = rawStudent.trim();
        return name ? { name, hasRufie: false, healthGroup: "Основна" } : null;
      }

      if (!rawStudent || typeof rawStudent !== "object") {
        return null;
      }

      const name = String(rawStudent.name || rawStudent.fullName || "").trim();
      if (!name) {
        return null;
      }

      const healthGroup = healthGroups.includes(rawStudent.healthGroup)
        ? rawStudent.healthGroup
        : "Основна";

      return {
        name,
        hasRufie: Boolean(rawStudent.hasRufie),
        healthGroup
      };
    }

    function normalizeStudents(students) {
      if (!Array.isArray(students)) {
        return [];
      }

      return students
        .map(normalizeStudent)
        .filter(Boolean);
    }

    function studentsToTextarea(students) {
      return normalizeStudents(students)
        .map(student => student.name)
        .join("\n");
    }

    function mergeStudentsWithExisting(inputNames, existingStudents = []) {
      const existingMap = new Map(
        normalizeStudents(existingStudents).map(student => [student.name.toLowerCase(), student])
      );

      return inputNames
        .map(name => {
          const normalizedName = name.trim();
          if (!normalizedName) {
            return null;
          }

          const existing = existingMap.get(normalizedName.toLowerCase());
          return existing || { name: normalizedName, hasRufie: false, healthGroup: "Основна" };
        })
        .filter(Boolean);
    }

    function loadSchedule() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return cloneDefaults();
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          return cloneDefaults();
        }
        const normalized = parsed.map(normalizeLesson).filter(Boolean);
        return normalized.length ? normalized : cloneDefaults();
      } catch (error) {
        console.error(error);
        return cloneDefaults();
      }
    }

    function getLesson(day, hour) {
      return scheduleData.find(item => item.day === day && Number(item.hour) === Number(hour)) || null;
    }

    function getLessonIndex(day, hour) {
      return scheduleData.findIndex(item => item.day === day && Number(item.hour) === Number(hour));
    }

    function getDayFull(shortDay) {
      const found = days.find(day => day.short === shortDay);
      return found ? found.full : shortDay;
    }

    function isOnlineLesson(lesson) {
      return /-\s*Д$/i.test(String(lesson.className).trim());
    }

    function upsertLesson(payload, originalKey = null) {
      const duplicateIndex = getLessonIndex(payload.day, payload.hour);
      if (duplicateIndex !== -1) {
        const isSameRecord = originalKey && payload.day === originalKey.day && Number(payload.hour) === Number(originalKey.hour);
        if (!isSameRecord) {
          scheduleData.splice(duplicateIndex, 1);
        }
      }

      if (originalKey) {
        const originalIndex = getLessonIndex(originalKey.day, originalKey.hour);
        if (originalIndex !== -1) {
          scheduleData.splice(originalIndex, 1, payload);
          return;
        }
      }

      scheduleData.push(payload);
    }

    function deleteCurrentLesson() {
      if (!currentEditKey) {
        return;
      }
      const index = getLessonIndex(currentEditKey.day, currentEditKey.hour);
      if (index !== -1) {
        scheduleData.splice(index, 1);
        saveSchedule();
        renderSchedule();

      closeOverlay(editOverlay);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

      if (!rawLesson || typeof rawLesson !== "object") {

      const hour = Number(rawLesson.hour);
      const subject = String(rawLesson.subject || "").trim();
      const className = String(rawLesson.className || "").trim();
      const students = normalizeStudents(rawLesson.students);

      const validDay = days.some(item => item.short === day);
      const validHour = Number.isInteger(hour) && hour >= 1 && hour <= 8;

      if (!validDay || !validHour || !subject || !className) {
        return null;
      }

      return { day, hour, subject, className, students };
    }

    function updateTimer() {
      if (!timerText) {
        return;
      }

      const intervals = getDailyLessonIntervals();
      if (!intervals.length) {
        timerText.textContent = "Поза розкладом.";
        return;
      }

      const now = new Date();
      const dayIndex = now.getDay();
      if (dayIndex === 0 || dayIndex === 6) {
        timerText.textContent = "Поза розкладом.";
        return;
      }
      const nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      const first = intervals[0];
      const last = intervals[intervals.length - 1];

      if (nowMinutes < first.start) {
        const minutesLeft = Math.max(0, Math.ceil(first.start - nowMinutes));
        timerText.textContent = `До початку уроку: ${minutesLeft} хв.`;
        return;
      }

      if (nowMinutes >= last.end) {
        timerText.textContent = "Поза розкладом.";
        return;
      }

      for (let i = 0; i < intervals.length; i += 1) {
        const current = intervals[i];
        const next = intervals[i + 1];

        if (nowMinutes >= current.start && nowMinutes < current.end) {
          const minutesLeft = Math.max(0, Math.ceil(current.end - nowMinutes));
          timerText.textContent = `До кінця уроку: ${minutesLeft} хв.`;
          return;
        }

        if (next && nowMinutes >= current.end && nowMinutes < next.start) {
          const minutesLeft = Math.max(0, Math.ceil(next.start - nowMinutes));
          timerText.textContent = `До кінця перерви: ${minutesLeft} хв.`;
          return;
        }
      }

      timerText.textContent = "Поза розкладом.";
    }

    function updateStudentMeta(day, hour, studentIndex, field, value) {
      const lesson = getLesson(day, hour);
      if (!lesson) {
        return;
      }

      const students = normalizeStudents(lesson.students);
      const student = students[studentIndex];
      if (!student) {
        return;
      }

      if (field === "hasRufie") {
        const nextValue = Boolean(value);
        student.hasRufie = nextValue;
        propagateRufieStatus(lesson.className, student.name, nextValue);
      }

      if (field === "healthGroup" && healthGroups.includes(value)) {
        student.healthGroup = value;
      }

      lesson.students = students;
      saveSchedule();
    }

    function propagateRufieStatus(className, studentName, nextValue) {
      const normalizedClass = String(className || "").trim().toLowerCase();
      const normalizedStudent = String(studentName || "").trim().toLowerCase();
      if (!normalizedClass || !normalizedStudent) {
        return;
      }

      scheduleData.forEach(item => {
        if (String(item.className || "").trim().toLowerCase() !== normalizedClass) {
          return;
        }

        const updatedStudents = normalizeStudents(item.students);
        let changed = false;

        updatedStudents.forEach(entry => {
          if (String(entry.name || "").trim().toLowerCase() === normalizedStudent) {
            entry.hasRufie = nextValue;
            changed = true;
          }
        });

        if (changed) {
          item.students = updatedStudents;
        }
      });
    }

    function sortSchedule(data) {
      const dayOrder = Object.fromEntries(days.map((day, index) => [day.short, index]));
      return [...data].sort((a, b) => {
        if (dayOrder[a.day] !== dayOrder[b.day]) {
          return dayOrder[a.day] - dayOrder[b.day];
        }
        return Number(a.hour) - Number(b.hour);
      });
    }

    function exportSchedule() {
      const payload = {
        exportedAt: new Date().toISOString(),
        lessons: sortSchedule(scheduleData)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "teacher-schedule.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      statusText.textContent = "Розклад експортовано в JSON.";
    }

    function importScheduleFromText(text) {
      const parsed = JSON.parse(text);
      const rawLessons = Array.isArray(parsed) ? parsed : parsed.lessons;

      if (!Array.isArray(rawLessons)) {
        throw new Error("JSON має містити масив уроків або поле lessons.");
      }

      const normalized = rawLessons
        .map(normalizeLesson)
        .filter(Boolean);

      if (!normalized.length) {
        throw new Error("Не знайдено жодного коректного уроку для імпорту.");
      }

      const uniqueMap = new Map();
      normalized.forEach(lesson => {
        uniqueMap.set(`${lesson.day}-${lesson.hour}`, lesson);
      });

      scheduleData = sortSchedule(Array.from(uniqueMap.values()));
      saveSchedule();
      renderSchedule();
      statusText.textContent = `Імпортовано уроків: ${scheduleData.length}.`;
    }

    scheduleBody.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) {
        return;
      }
      const { action, day, hour } = target.dataset;
      if (action === "view") {
        openViewModal(day, Number(hour));
      }
      if (action === "edit" || action === "create") {
        openEditModal(day, Number(hour));
      }
    });

    editTimesBtn.addEventListener("click", openTimesModal);

    timesForm.addEventListener("submit", event => {
      event.preventDefault();

      const nextTimes = {};
      for (let hour = 1; hour <= 8; hour += 1) {
        const startInput = timesForm.querySelector(`[data-time-hour="${hour}"][data-time-field="start"]`);
        const endInput = timesForm.querySelector(`[data-time-hour="${hour}"][data-time-field="end"]`);
        const start = startInput ? startInput.value : "";
        const end = endInput ? endInput.value : "";

        if (!start || !end) {
          window.alert(`Заповніть час для ${hour} уроку.`);
          return;
        }

        const startMinutes = parseTimeToMinutes(start);
        const endMinutes = parseTimeToMinutes(end);
        if (startMinutes === null || endMinutes === null || endMinutes <= startMinutes) {
          window.alert(`Перевірте інтервал для ${hour} уроку.`);
          return;
        }

        nextTimes[hour] = `${start} - ${end}`;
      }

      lessonTimes = nextTimes;
      saveLessonTimes();
      populateFormOptions();
      renderSchedule();
      updateTimer();
      statusText.textContent = "Часи уроків оновлено.";
      closeOverlay(timesOverlay);
    });

    studentsList.addEventListener("change", event => {
      const target = event.target;
      const field = target.dataset.field;
      const studentIndex = Number(target.dataset.studentIndex);

      if (!currentViewKey || !field || Number.isNaN(studentIndex)) {
        return;
      }

      if (field === "hasRufie") {
        updateStudentMeta(currentViewKey.day, currentViewKey.hour, studentIndex, field, target.checked);
      }

      if (field === "healthGroup") {
        updateStudentMeta(currentViewKey.day, currentViewKey.hour, studentIndex, field, target.value);
      }
    });

    lessonForm.addEventListener("submit", event => {
      event.preventDefault();
      const existingLesson = currentEditKey ? getLesson(currentEditKey.day, currentEditKey.hour) : null;
      const studentNames = parseStudents(lessonStudents.value);
      const payload = {
        day: lessonDay.value,
        hour: Number(lessonHour.value),
        subject: lessonSubject.value.trim(),
        className: lessonClass.value.trim(),
        students: mergeStudentsWithExisting(studentNames, existingLesson ? existingLesson.students : [])
      };

      if (!payload.subject || !payload.className) {
        return;
      }

      upsertLesson(payload, currentEditKey);
      saveSchedule();
      renderSchedule();
      closeOverlay(editOverlay);
    });

    editFromViewBtn.addEventListener("click", () => {
      if (!currentViewKey) {
        return;
      }
      closeOverlay(viewOverlay);
      openEditModal(currentViewKey.day, currentViewKey.hour);
    });

    deleteLessonBtn.addEventListener("click", deleteCurrentLesson);

    printBtn.addEventListener("click", () => window.print());
    resetBtn.addEventListener("click", resetSchedule);

    document.querySelectorAll("[data-close]").forEach(button => {
      button.addEventListener("click", () => {
        const type = button.getAttribute("data-close");
        if (type === "view") {
          closeOverlay(viewOverlay);
        }
        if (type === "edit") {
          closeOverlay(editOverlay);
        }
        if (type === "times") {
          closeOverlay(timesOverlay);
        }
      });
    });

    [viewOverlay, editOverlay, timesOverlay].forEach(overlay => {
      overlay.addEventListener("click", event => {
        if (event.target === overlay) {
          closeOverlay(overlay);
        }
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeOverlay(viewOverlay);
        closeOverlay(editOverlay);
        closeOverlay(timesOverlay);
      }
    });

    populateFormOptions();
    renderSchedule();
    updateTimer();
    setInterval(updateTimer, 30000);
  </script>
</body>
</html>
